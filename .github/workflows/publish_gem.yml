name: Publish Gem
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        type: string

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  push:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      # Set up
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: ruby

      - name: Update version
        run: |
          sed -i 's/".*"/"${{ inputs.version }}"/' lib/pay/version.rb
          bundle config set --local deployment 'false'
          # Only the lockfiles need the new version, so resolve without installing anything
          bundle lock
          for gemfile in gemfiles/*.gemfile; do
            BUNDLE_GEMFILE=$gemfile bundle lock
          done
          git config user.name 'GitHub Actions'
          git config user.email github-actions@github.com
          git add Gemfile.lock gemfiles lib
          # The version may already be bumped on main; only commit when something changed
          git diff --cached --quiet || { git commit -m "Version bump" && git push; }

      # Release
      - uses: rubygems/release-gem@v1
